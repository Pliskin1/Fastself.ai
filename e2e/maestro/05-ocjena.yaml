# v1 has no AI consent flow, so flow 05 checks the rating: 5 stars, a chip, send, thank-you with the store button.
appId: ai.fastself.app
---
- launchApp
- openLink: 'fastself://dev?reset=1&preset=orthodox&date=2026-12-02&time=12:00&tab=profil'
- scrollUntilVisible:
    element: { id: 'row-rate' }
- tapOn: { id: 'row-rate' }
- assertVisible: { id: 'screen-prijava-greske' }
- tapOn: { id: 'star-5' }
- assertVisible: 'Odlično'
- tapOn: { id: 'chip-feedback-timer' }
- tapOn: { id: 'btn-send-feedback' }
- assertVisible: { id: 'rating-thanks' }
- assertVisible: { id: 'btn-store-review' }
- tapOn: { id: 'btn-rating-done' }
