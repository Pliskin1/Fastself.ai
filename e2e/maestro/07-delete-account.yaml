# Continues from 06 (signed in): delete the account from the account card, then keep the phone data.
appId: ai.fastself.app
---
- launchApp
- extendedWaitUntil: { visible: 'Profil|Počni', timeout: 30000 }
- openLink: 'fastself://dev?tab=profil'
- assertVisible: { id: 'btn-sign-out' }
- tapOn: { id: 'btn-delete-account' }
- assertVisible: { id: 'screen-brisanje' }
- tapOn: { id: 'btn-confirm-delete' }
- assertVisible: 'Nalog i podaci na serveru su obrisani'
- tapOn: { id: 'btn-keep-local' }
- assertVisible: { id: 'screen-profil' }
- assertVisible: { id: 'btn-open-account' }
