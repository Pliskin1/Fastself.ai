# Email + password sign up against LOCAL Supabase (email confirmation off), then turn on sync.
appId: ai.fastself.app
env:
  EMAIL: e2e-${MAESTRO_TS}@test.local
  PASSWORD: lozinka-e2e-1
---
- launchApp
- openLink: 'fastself://dev?reset=1&preset=orthodox&date=2026-12-02&time=12:00&tab=profil'
- tapOn: { id: 'btn-open-account' }
- assertVisible: { id: 'screen-nalog' }
- tapOn: { id: 'seg-auth-mode-signUp' }
- tapOn: { id: 'input-email' }
- inputText: ${EMAIL}
- tapOn: { id: 'input-password' }
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: { id: 'btn-auth-submit' }
- assertVisible: 'Šta da sinhronizujemo?'
- tapOn: { id: 'btn-enable-sync' }
- assertVisible: { id: 'screen-profil' }
- assertVisible: { id: 'btn-sign-out' }
- assertVisible: ${EMAIL}
